name: Web E2E

# Browser regression gate for the Next.js app. Runs on pull requests that target main.
# - Plain `pull_request` (never `pull_request_target`): code from a fork never runs with secrets.
# - No secrets are used. The suite serves a production build against e2e/mock-api.mjs, so it needs
#   no database, no Django, no live data and no credentials.
# - Read-only token.
on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-e2e.yml"

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults: { run: { working-directory: web } }
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install ${{ matrix.browser }} and its system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests (responsive layout, search, navigation, auth console, axe)
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload report, traces and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore
