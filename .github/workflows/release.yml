name: Release (staging checks, then approval)

# Manual. Step 1 re-runs every check against the chosen commit in the `staging` environment.
# Step 2 waits for a required reviewer on the `production-approval` environment (configured in
# GitHub: Settings > Environments) and only then applies database migrations to production.
# Take a Neon snapshot first (docs/ADMIN.md). Needs the repository secrets DATABASE_URL and
# SECRET_KEY. Vercel still builds each push to main by itself: to make approval the only way to
# change production, also set the Vercel project's production branch / ignored build step to
# deploy only what this workflow approves (see docs/UPGRADE_PHASES.md).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to release"
        default: main

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: API checks
        working-directory: api
        env: { DEBUG: "true", SECRET_KEY: ci-only-not-a-secret, DATABASE_URL: "sqlite:///rel.sqlite3" }
        run: |
          pip install -r requirements-dev.txt
          ruff check . && ruff format --check .
          python manage.py makemigrations --check --dry-run
          pytest -q
      - name: Web checks
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production-approval # a required reviewer must approve before this job starts
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements.txt }
      - name: Apply migrations to production
        working-directory: api
        env:
          DEBUG: "false"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED_HOSTS: localhost
        run: |
          pip install -r requirements.txt
          python manage.py showmigrations --plan | tail -n 15
          python manage.py migrate --noinput
