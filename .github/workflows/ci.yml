name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    env:
      # Tests need these because api/.env is not in git (verified locally with .env hidden).
      DEBUG: "true"
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: sqlite:///ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Production-like deploy check (must be clean)
        run: python manage.py check --deploy
        env:
          DEBUG: "false"
          SECRET_KEY: ci-only-not-a-secret-but-long-enough-to-pass-the-deploy-check-0123456789
          ALLOWED_HOSTS: api.example.com
      - run: pytest -q

  # Same suite on Postgres (what production uses). Informational until it has been seen green;
  # then remove `continue-on-error` so it gates merges too.
  api-postgres:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: vet }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run format && npm run typecheck
      - run: npm test
      - run: npm run build
